name: v2-foundation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: false
      - run: ./scripts/uv python install 3.12
      - run: ./scripts/uv sync --locked --extra server --group dev
      - run: ./scripts/check

  postgres:
    name: PostgreSQL ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aris_test
          POSTGRES_USER: aris_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aris_test -d aris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: false
      - run: ./scripts/uv python install 3.12
      - run: ./scripts/uv sync --locked --extra server --group dev
      - name: Provision test-only PostgreSQL extension
        run: |
          ./scripts/uv run --locked --extra server python - <<'PYCODE'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['ARIS_TEST_DATABASE_URL'])
          assert url.host == '127.0.0.1' and url.database == 'aris_test'
          engine = create_engine(url)
          with engine.begin() as connection:
              assert connection.scalar(text('SELECT current_database()')) == 'aris_test'
              connection.execute(text('CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public'))
          engine.dispose()
          PYCODE
      - name: PostgreSQL contracts, migrations and concurrency
        run: ./scripts/uv run --locked --extra server pytest -q --database-only --postgres-template --ci-shard=${{ matrix.shard }} --durations=20

  smoke:
    name: PostgreSQL process and recovery smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aris_test
          POSTGRES_USER: aris_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aris_test -d aris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: false
      - run: ./scripts/uv python install 3.12
      - run: ./scripts/uv sync --locked --extra server --group dev
      - name: Provision test-only PostgreSQL extension
        run: |
          ./scripts/uv run --locked --extra server python - <<'PYCODE'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['ARIS_TEST_DATABASE_URL'])
          assert url.host == '127.0.0.1' and url.database == 'aris_test'
          engine = create_engine(url)
          with engine.begin() as connection:
              assert connection.scalar(text('SELECT current_database()')) == 'aris_test'
              connection.execute(text('CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public'))
          engine.dispose()
          PYCODE
      - name: On-demand outbound WebSocket preview and stop-on-unsubscribe
        run: ./scripts/uv run --locked --extra server python scripts/smoke_live.py
      - name: Resource CLI, partial failure and recovery
        run: ./scripts/uv run --locked --extra server python scripts/smoke.py --postgres
      - name: Resource offline spool, API restart and exact replay
        run: ./scripts/uv run --locked --extra server python scripts/smoke_recovery.py --postgres
      - name: Bounded historical backlog and lost acknowledgement
        run: ./scripts/uv run --locked --extra server python scripts/smoke_backlog.py --postgres --cycles 256

  # Keep the original required-check name and require every backend/shard/smoke.
  check:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [quality, postgres, smoke]
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          QUALITY: ${{ needs.quality.result }}
          POSTGRES: ${{ needs.postgres.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: test "$QUALITY" = success && test "$POSTGRES" = success && test "$SMOKE" = success
