name: v2-foundation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aris_test
          POSTGRES_USER: aris_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aris_test -d aris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: false
      - run: ./scripts/uv python install 3.12
      - run: ./scripts/uv sync --locked --extra server --group dev
      - run: ./scripts/check
      - name: On-demand outbound WebSocket preview and stop-on-unsubscribe
        run: ./scripts/uv run --locked --extra server python scripts/smoke_live.py
      - name: PostgreSQL contracts, migrations and concurrent ingestion
        env:
          ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
        run: |
          ./scripts/uv run --locked --extra server python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['ARIS_TEST_DATABASE_URL'])
          assert url.host == '127.0.0.1' and url.database == 'aris_test'
          engine = create_engine(url)
          with engine.begin() as connection:
              assert connection.scalar(text('SELECT current_database()')) == 'aris_test'
              connection.execute(text('CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public'))
          engine.dispose()
          PY
          ./scripts/uv run --locked --extra server pytest -q
      - name: PostgreSQL resource CLI, partial failure and recovery
        env:
          ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
        run: ./scripts/uv run --locked --extra server python scripts/smoke.py --postgres
      - name: PostgreSQL resource offline spool, API restart and exact replay
        env:
          ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
        run: ./scripts/uv run --locked --extra server python scripts/smoke_recovery.py --postgres
      - name: PostgreSQL bounded historical backlog and lost acknowledgement
        env:
          ARIS_TEST_DATABASE_URL: postgresql+psycopg://aris_test:ci-test-only-password@127.0.0.1:5432/aris_test
        run: ./scripts/uv run --locked --extra server python scripts/smoke_backlog.py --postgres --cycles 256
